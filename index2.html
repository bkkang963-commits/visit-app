<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한화임팩트 울산공장 공사 출입신청</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --hw-orange: #FF6600;
            --hw-orange-light: #FFF5EE;
            --hw-orange-border: #FFD2B2;
            --hw-dark: #222222;
            --hw-gray: #767676;
            --hw-bg: #F4F4F4;
            --hw-white: #FFFFFF;
            --hw-danger: #D9534F;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: var(--hw-bg); 
            padding: 20px; 
            color: var(--hw-dark); 
            line-height: 1.6; 
            margin: 0;
        }

        .header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        h3 { color: var(--hw-orange); font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .form-group { 
            background: var(--hw-white); 
            padding: 18px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
            border-left: 4px solid var(--hw-white); 
            transition: all 0.3s;
        }
        .form-group:focus-within { border-left: 4px solid var(--hw-orange); box-shadow: 0 4px 12px rgba(255, 102, 0, 0.1); }
        
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--hw-dark); }
        .sub-label { font-size: 11px; color: var(--hw-gray); font-weight: normal; display: block; margin-top: 4px; line-height: 1.4; }
        
        input, select { 
            width: 100%; border: none; font-size: 16px; outline: none; padding: 10px 0; 
            border-bottom: 1.5px solid #E0E0E0; background: transparent; color: var(--hw-dark); 
            border-radius: 0;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-bottom: 1.5px solid var(--hw-orange); }

        .phone-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phone-group span {
            color: var(--hw-gray);
            font-weight: bold;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 10px 0;
        }
        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--hw-orange);
        }
        .badge-count {
            background-color: var(--hw-orange);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .visitor-card {
            background: var(--hw-orange-light);
            border: 1px solid var(--hw-orange-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 14px;
            color: var(--hw-orange);
        }
        .btn-del {
            background: none;
            border: none;
            color: var(--hw-danger);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            margin: 0;
            box-shadow: none;
            width: auto;
        }

        .btn-add {
            width: 100%;
            padding: 14px;
            background: var(--hw-white);
            color: var(--hw-orange);
            border: 1.5px dashed var(--hw-orange);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
            box-shadow: none;
        }
        .btn-add:active {
            background: var(--hw-orange-light);
            transform: scale(0.99);
        }

        #submit_btn { 
            width: 100%; padding: 18px; background: var(--hw-orange); color: white; border: none; 
            border-radius: 4px; font-size: 18px; font-weight: bold; margin-top: 15px; 
            margin-bottom: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 102, 0, 0.2); transition: all 0.2s;
        }
        #submit_btn:active { background: #E65C00; transform: scale(0.98); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .paste-box {
            background: var(--hw-orange-light);
            border: 1.5px dashed var(--hw-orange);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 18px;
        }
        .paste-box textarea {
            width: 100%;
            min-height: 105px;
            border: 1px solid var(--hw-orange-border);
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.45;
            background: #fff;
            color: var(--hw-dark);
            box-sizing: border-box;
            outline: none;
            resize: vertical;
        }
        .paste-box textarea:focus { border-color: var(--hw-orange); }
        .paste-btns { display: flex; gap: 8px; margin-top: 8px; }
        .btn-autofill {
            flex: 2; padding: 11px; background: #1e293b; color: #fff; border: none;
            border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .btn-clear-p {
            flex: 1; padding: 11px; background: #e2e8f0; color: #334155; border: none;
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .parse-msg { font-size: 12px; font-weight: 700; margin-top: 6px; min-height: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>한화임팩트 울산공장</h3>
            <div style="font-size: 14px; color: #555; margin-top: 5px; font-weight: 600;">공사 출입 신청 시스템</div>
        </div>

        <!-- 0. 카톡/문자 복붙 AI 자동 채우기 -->
        <div class="paste-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <label style="color: var(--hw-orange); font-size: 14px; margin: 0;">🤖 단톡방/문자 복붙 → AI 자동 채우기</label>
                <button type="button" onclick="configApiKey()" style="padding:4px 8px;font-size:11px;font-weight:700;background:#fff;color:#475569;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer;">🔑 AI 키</button>
            </div>
            <textarea id="raw_paste" placeholder="카톡·문자 내용을 편하게 붙여넣으세요! (여러 명 명단도 OK)&#10;예: 내일부터 3일간 제이콘 배관 플랜지 교체 공사. 홍길동 850312 010-1234-5678, 김철수 880515 010-9876-5432"></textarea>
            <div class="paste-btns">
                <button type="button" class="btn-autofill" id="btn_autofill" onclick="autoFillWorker()">✨ AI로 자동 채우기</button>
                <button type="button" class="btn-clear-p" onclick="clearRawPaste()">지우기</button>
            </div>
            <div id="parse_msg" class="parse-msg"></div>
        </div>

        <!-- 1. 공통 공사 정보 -->
        <div class="form-group">
            <label>소속 업체명</label>
            <input type="text" id="company" placeholder="예: 한화건설">
        </div>

        <div class="form-group">
            <label>공사(작업)명</label>
            <input type="text" id="reason" placeholder="예: 정기 보수공사 배관 정비">
        </div>

        <div class="form-group">
            <label>안전교육일 (출입일)</label>
            <input type="date" id="edu_date" max="2099-12-31">
        </div>

        <div class="form-group">
            <label>공사 착수일</label>
            <input type="date" id="s_date" max="2099-12-31">
        </div>

        <div class="form-group">
            <label>공사 완료예정일</label>
            <input type="date" id="e_date" max="2099-12-31">
        </div>

        <div class="form-group">
            <label>담당자 성함
                <span class="sub-label">직함은 제외하고 성함만 입력해주세요.</span>
            </label>
            <input type="text" id="manager" placeholder="예: 강병근" oninput="matchApprover()">
        </div>
        
        <div class="form-group">
            <label>결재자 성함 (차상위)
                <span class="sub-label">담당자 입력 시 자동으로 매칭됩니다.</span>
            </label>
            <input type="text" id="approver" placeholder="예: 노정락">
        </div>

        <!-- 2. 기본 작업자 (신청자 본인) 인적사항 -->
        <div class="section-header">
            <span class="section-title">작업자 인적사항</span>
            <span class="badge-count" id="worker_badge">총 1명</span>
        </div>

        <div class="form-group">
            <label>작업자 성함</label>
            <input type="text" id="name" placeholder="예: 김작업">
        </div>

        <div class="form-group">
            <label>생년월일(8자리)</label>
            <input type="number" id="birth" placeholder="예: 19850101" oninput="limitLength(this, 8)">
        </div>

        <div class="form-group">
            <label>휴대전화 번호</label>
            <div class="phone-group">
                <span style="font-size: 15px;">010</span>
                <span>-</span>
                <input type="number" id="phone_f" placeholder="1234" oninput="limitLength(this, 4)">
                <span>-</span>
                <input type="number" id="phone_b" placeholder="5678" oninput="limitLength(this, 4)">
            </div>
        </div>

        <!-- 3. 동행 작업자 추가 영역 -->
        <div id="additional_workers"></div>

        <button type="button" class="btn-add" onclick="addWorkerCard()">+ 동행 작업자 추가하기</button>
        <button id="submit_btn">신청서 제출하기</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const todayStr = new Date().toISOString().substring(0, 10);
        document.getElementById('edu_date').value = todayStr;
        document.getElementById('s_date').value = todayStr;
        document.getElementById('e_date').value = todayStr;

        const approverList = {
            "원동휘": "노정락", "김일동": "노정락", "김태수": "노정락", "송학선": "노정락",
            "김경도": "노정락", "오상현": "노정락", "권규남": "노정락", "김창수": "노정락",
            "임희철": "노정락", "최환석": "노정락", "박철": "노정락", "노순택": "노정락",
            "전희철": "노정락", "김성현": "노정락", "정제민": "노정락", "조동민": "노정락",
            "김철재": "노정락", "고준영": "노정락", "정주석": "노정락", "송민근": "노정락",
            "송명국": "노정락", "이호정": "노정락", "김영훈": "노정락", "이기석": "노정락",
            "최성식": "노정락", "우재민": "노정락", "염종한": "노정락", "고동완": "노정락",
            "박준영": "노정락", "강병근": "노정락", "이곤": "노정락", "김대현": "노정락",
            "박삼조": "노정락", "박해덕": "노정락", "장미수": "노정락", "박종록": "노정락",
            "이상득": "노정락", "배진수": "노정락", "조정범": "노정락", "최경수": "노정락",
            "김익기": "노정락", "김현식": "노정락", "피정범": "노정락", "이영교": "노정락",
            "모성주": "노정락"
        };

        function matchApprover() {
            const managerEl = document.getElementById('manager');
            const approverEl = document.getElementById('approver');
            const managerName = managerEl.value.trim();

            if (managerName.length > 5) {
                managerEl.value = managerName.slice(0, 5);
            }

            if (approverList[managerName]) {
                approverEl.value = approverList[managerName];
            } else {
                approverEl.value = ""; 
            }
        }

        function limitLength(el, maxLength) {
            if (el.value.length > maxLength) { el.value = el.value.slice(0, maxLength); }
        }

        function addWorkerCard() {
            const container = document.getElementById('additional_workers');
            const currentExtraCount = container.querySelectorAll('.visitor-card').length;
            const workerNum = currentExtraCount + 2;

            const card = document.createElement('div');
            card.className = 'visitor-card';
            card.innerHTML = `
                <div class="card-top">
                    <span>동행 작업자 #${workerNum}</span>
                    <button type="button" class="btn-del" onclick="removeWorkerCard(this)">삭제</button>
                </div>
                <div>
                    <label>작업자 성함</label>
                    <input type="text" class="w_name" placeholder="예: 박작업">
                </div>
                <div style="margin-top: 10px;">
                    <label>소속 업체명 (선택)
                        <span class="sub-label" style="font-size: 10px;">미입력 시 상단 '소속 업체명'이 자동 적용됩니다.</span>
                    </label>
                    <input type="text" class="w_company" placeholder="미입력 시 상단 업체명 적용">
                </div>
                <div style="margin-top: 10px;">
                    <label>생년월일 (8자리)</label>
                    <input type="number" class="w_birth" placeholder="예: 19880505" oninput="limitLength(this, 8)">
                </div>
                <div style="margin-top: 10px;">
                    <label>휴대전화 번호</label>
                    <div class="phone-group">
                        <span style="font-size: 15px;">010</span>
                        <span>-</span>
                        <input type="number" class="w_phone_f" placeholder="1234" oninput="limitLength(this, 4)">
                        <span>-</span>
                        <input type="number" class="w_phone_b" placeholder="5678" oninput="limitLength(this, 4)">
                    </div>
                </div>
            `;
            container.appendChild(card);
            updateWorkerBadge();
        }

        function removeWorkerCard(btn) {
            const card = btn.closest('.visitor-card');
            card.remove();
            reorderCards();
        }

        function reorderCards() {
            const cards = document.querySelectorAll('.visitor-card');
            cards.forEach((card, index) => {
                const num = index + 2;
                card.querySelector('.card-top span').innerText = `동행 작업자 #${num}`;
            });
            updateWorkerBadge();
        }

        function updateWorkerBadge() {
            const extraCount = document.querySelectorAll('.visitor-card').length;
            const totalCount = 1 + extraCount;
            document.getElementById('worker_badge').innerText = `총 ${totalCount}명`;
        }

        // 담당자 성함 기억
        const savedMgr = localStorage.getItem('hw_visit_manager');
        if (savedMgr) {
            document.getElementById('manager').value = savedMgr;
            matchApprover();
        }
        document.getElementById('manager').addEventListener('change', (e) => {
            if (e.target.value.trim()) localStorage.setItem('hw_visit_manager', e.target.value.trim());
        });

        // =========================================================================
        // 단톡방/문자 복붙 -> 공사 출입신청 스마트 자동 파서
        // =========================================================================
        function clearRawPaste() {
            document.getElementById('raw_paste').value = '';
            document.getElementById('parse_msg').textContent = '';
        }

        function _normDate(str) {
            const yr = new Date().getFullYear();
            let m = str.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
            if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
            m = str.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
            if (m) return `${yr}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
            m = str.match(/(?:^|[^\d])(\d{1,2})[.\-\/](\d{1,2})(?:[^\d]|$)/);
            if (m && parseInt(m[1],10) >= 1 && parseInt(m[1],10) <= 12 && parseInt(m[2],10) >= 1 && parseInt(m[2],10) <= 31) {
                return `${yr}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
            }
            return '';
        }

        function _normBirth(raw) {
            let m = raw.match(/(19\d{2}|20\d{2})[.\-\/\s]?(\d{2})[.\-\/\s]?(\d{2})/);
            if (m) return `${m[1]}${m[2]}${m[3]}`;
            m = raw.match(/(?:^|[^\d])(\d{2})[.\-\/]?(\d{2})[.\-\/]?(\d{2})(?:[^\d]|$)/);
            if (m) {
                const yy = parseInt(m[1], 10), mm = parseInt(m[2], 10), dd = parseInt(m[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    const prefix = yy >= 26 ? '19' : '20';
                    return `${prefix}${m[1]}${m[2]}${m[3]}`;
                }
            }
            return '';
        }

        function _normPhone(raw) {
            const m = raw.match(/010[.\-\s]?(\d{4})[.\-\s]?(\d{4})/);
            return m ? { f: m[1], b: m[2], raw: m[0] } : null;
        }

        function parseWorkerText(raw) {
            const cleaned = raw.replace(/(?:오전|오후)\s*\d{1,2}:\d{2}/g, '').replace(/\r\n/g, '\n');
            const lines = cleaned.split('\n').map(l => l.trim()).filter(Boolean);
            const res = { company: '', reason: '', edu_date: '', s_date: '', e_date: '', manager: '', people: [] };
            let curPerson = null;

            function flushPerson() {
                if (curPerson && (curPerson.name || curPerson.birth || curPerson.phone_f)) {
                    res.people.push(curPerson);
                }
                curPerson = null;
            }

            for (const line of lines) {
                const ph = _normPhone(line);
                if (ph && !/^(?:연락처|전화|휴대폰|핸드폰|HP)\s*[:：]/i.test(line)) {
                    flushPerson();
                    let rest = line.replace(ph.raw, ' ');
                    const birth = _normBirth(rest);
                    if (birth) rest = rest.replace(/(19\d{2}|20\d{2})[.\-\/\s]?\d{2}[.\-\/\s]?\d{2}|\d{2}[.\-\/]?\d{2}[.\-\/]?\d{2}/, ' ');
                    rest = rest.replace(/^[\d.)\-\s•*]+/, '').replace(/[\/|,()]/g, ' ').replace(/\s+/g, ' ').trim();
                    const toks = rest.split(' ').filter(Boolean);
                    let pName = '', pComp = '';
                    for (const tk of toks) {
                        if (!pName && /^[가-힣]{2,4}$/.test(tk) && !['대표','부장','차장','과장','대리','주임','사원','팀장','소장','프로','기사','반장'].includes(tk)) {
                            pName = tk;
                        } else if (!['대표','부장','차장','과장','대리','주임','사원','팀장','소장','프로','기사','반장','님'].includes(tk)) {
                            pComp = pComp ? `${pComp} ${tk}` : tk;
                        }
                    }
                    res.people.push({ name: pName, company: pComp, birth, phone_f: ph.f, phone_b: ph.b });
                    continue;
                }

                let m;
                if ((m = line.match(/^(?:업체명?|회사명?|소속|협력업체)\s*[:：\/]\s*(.+)$/))) { res.company = m[1].trim(); continue; }
                if ((m = line.match(/^(?:공사명?|작업명?|공사내용|작업내용|사유)\s*[:：\/]\s*(.+)$/))) { res.reason = m[1].trim(); continue; }
                if ((m = line.match(/^(?:안전교육일|교육일|출입일)\s*[:：\/]\s*(.+)$/))) { const d = _normDate(m[1]); if (d) res.edu_date = d; continue; }
                if ((m = line.match(/^(?:공사기간|작업기간|기간)\s*[:：\/]\s*(.+)$/))) {
                    const parts = m[1].split(/[~～\-]/);
                    if (parts[0]) { const d1 = _normDate(parts[0]); if (d1) res.s_date = d1; }
                    if (parts[1]) { const d2 = _normDate(parts[1]); if (d2) res.e_date = d2; }
                    continue;
                }
                if ((m = line.match(/^(?:착수일|시작일|공사시작일)\s*[:：\/]\s*(.+)$/))) { const d = _normDate(m[1]); if (d) res.s_date = d; continue; }
                if ((m = line.match(/^(?:완료일|종료일|완료예정일)\s*[:：\/]\s*(.+)$/))) { const d = _normDate(m[1]); if (d) res.e_date = d; continue; }
                if ((m = line.match(/^(?:담당자|감독자|관리감독자|신청자)\s*[:：\/]\s*([가-힣]{2,4})/))) { res.manager = m[1].trim(); continue; }

                if ((m = line.match(/^(?:성함|이름|작업자|성명)\s*[:：\/]\s*([가-힣]{2,4})/))) {
                    if (curPerson && curPerson.name) flushPerson();
                    curPerson = curPerson || { name: '', company: '', birth: '', phone_f: '', phone_b: '' };
                    curPerson.name = m[1].trim();
                    continue;
                }
                if ((m = line.match(/^(?:생년월일|생일|주민번호앞자리)\s*[:：\/]\s*(.+)$/))) {
                    curPerson = curPerson || { name: '', company: '', birth: '', phone_f: '', phone_b: '' };
                    curPerson.birth = _normBirth(m[1]);
                    continue;
                }
                if (ph && /^(?:연락처|전화|휴대폰|핸드폰|HP)\s*[:：\/]/i.test(line)) {
                    curPerson = curPerson || { name: '', company: '', birth: '', phone_f: '', phone_b: '' };
                    curPerson.phone_f = ph.f;
                    curPerson.phone_b = ph.b;
                    continue;
                }
            }
            flushPerson();

            if (!res.edu_date && res.s_date) res.edu_date = res.s_date;
            if (!res.e_date && res.s_date) res.e_date = res.s_date;
            if (!res.manager) {
                for (const mgr of Object.keys(approverList)) {
                    if (raw.includes(mgr)) { res.manager = mgr; break; }
                }
            }
            return res;
        }

        function _localDateOffset(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function configApiKey() {
            const cur = localStorage.getItem('hw_gemini_api_key') || '';
            const val = prompt('무료 Gemini API 키를 입력해 주세요.\n(정비이력·내방객·공사 페이지가 같은 키를 자동 공유합니다.)', cur);
            if (val !== null) {
                const t = val.trim();
                const msgEl = document.getElementById('parse_msg');
                if (t) {
                    localStorage.setItem('hw_gemini_api_key', t);
                    msgEl.style.color = '#15803d';
                    msgEl.textContent = '🔑 AI 키가 저장되었습니다!';
                } else {
                    localStorage.removeItem('hw_gemini_api_key');
                    msgEl.style.color = '#64748b';
                    msgEl.textContent = 'AI 키를 삭제했습니다 (기본 파서로 동작).';
                }
            }
        }

        async function _parseWorkerWithAI(raw, apiKey) {
            const todayStr = _localDateOffset(0);
            const tomorrowStr = _localDateOffset(1);
            const dayAfterStr = _localDateOffset(2);
            const yesterdayStr = _localDateOffset(-1);
            const promptText = `당신은 한화임팩트 울산공장 공사 출입신청 자동 입력 비서입니다.
[날짜 기준표] 오늘=${todayStr}, 내일=${tomorrowStr}, 모레=${dayAfterStr}, 어제=${yesterdayStr}
아래 텍스트에서 공사 출입 정보를 추출해 순수 JSON만 출력하세요 (코드블록 \`\`\` 및 설명 금지).

[규칙]
1. people 배열에 언급된 모든 작업자를 빠짐없이 넣으세요.
2. birth는 반드시 8자리 숫자 YYYYMMDD로 변환 (예: 880515 -> "19880515", 010315 -> "20010315"). 모르면 "".
3. phone_f는 010 뒤 중간 4자리, phone_b는 끝 4자리 (예: 010-1234-5678 -> phone_f:"1234", phone_b:"5678").
4. edu_date(안전교육일), s_date(공사착수일), e_date(완료예정일)는 YYYY-MM-DD 형식. 교육일 언급 없으면 s_date와 동일하게.
5. reason(공사명)은 간결하고 명확한 공사명으로 다듬으세요.
6. manager는 직급 빼고 2~4자 성함만.

[입력 텍스트]
${raw}

[출력 JSON]
{"company":"","reason":"","edu_date":"${todayStr}","s_date":"${todayStr}","e_date":"${todayStr}","manager":"","people":[{"name":"","company":"","birth":"","phone_f":"","phone_b":""}]}`;

            for (const model of ['gemini-flash-lite-latest', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite']) {
                try {
                    const resp = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }], generationConfig: { temperature: 0.1 } })
                        }
                    );
                    if (!resp.ok) continue;
                    const data = await resp.json();
                    const txt = (data?.candidates?.[0]?.content?.parts?.[0]?.text || '').replace(/^```(?:json)?\s*|\s*```$/g, '').trim();
                    const m = txt.match(/\{[\s\S]*\}/);
                    if (m) return JSON.parse(m[0]);
                } catch (e) {}
            }
            return null;
        }

        async function autoFillWorker() {
            const raw = document.getElementById('raw_paste').value.trim();
            const msgEl = document.getElementById('parse_msg');
            const btn = document.getElementById('btn_autofill');
            if (!raw) {
                msgEl.style.color = '#dc2626';
                msgEl.textContent = '먼저 붙여넣을 내용을 입력해 주세요!';
                return;
            }

            const apiKey = localStorage.getItem('hw_gemini_api_key') || '';
            let parsed = null;
            let usedAi = false;

            if (apiKey) {
                btn.disabled = true;
                btn.textContent = '🤖 AI 분석 중...';
                msgEl.style.color = '#0369a1';
                msgEl.textContent = 'Gemini AI가 공사 출입 정보를 정리하고 있습니다...';
                parsed = await _parseWorkerWithAI(raw, apiKey);
                btn.disabled = false;
                btn.textContent = '✨ AI로 자동 채우기';
                if (parsed) usedAi = true;
            }
            if (!parsed) {
                parsed = parseWorkerText(raw);
            }

            const todayStr = _localDateOffset(0);
            if (/내일/.test(raw) && (!parsed.s_date || parsed.s_date === todayStr)) {
                parsed.s_date = _localDateOffset(1);
                if (!parsed.edu_date || parsed.edu_date === todayStr) parsed.edu_date = parsed.s_date;
                if (!parsed.e_date || parsed.e_date < parsed.s_date) parsed.e_date = parsed.s_date;
            }

            if (parsed.company) document.getElementById('company').value = parsed.company;
            if (parsed.reason) document.getElementById('reason').value = parsed.reason;
            if (parsed.edu_date) document.getElementById('edu_date').value = parsed.edu_date;
            if (parsed.s_date) document.getElementById('s_date').value = parsed.s_date;
            if (parsed.e_date) document.getElementById('e_date').value = parsed.e_date;
            if (parsed.manager) {
                document.getElementById('manager').value = parsed.manager;
                matchApprover();
            }

            const people = Array.isArray(parsed.people) ? parsed.people : [];
            if (people.length > 0) {
                document.getElementById('additional_workers').innerHTML = '';
                const p0 = people[0];
                document.getElementById('name').value = p0.name || '';
                document.getElementById('birth').value = String(p0.birth || '').replace(/\D/g, '').slice(0, 8);
                document.getElementById('phone_f').value = String(p0.phone_f || '').replace(/\D/g, '').slice(0, 4);
                document.getElementById('phone_b').value = String(p0.phone_b || '').replace(/\D/g, '').slice(0, 4);
                if (!parsed.company && p0.company) document.getElementById('company').value = p0.company;

                for (let i = 1; i < people.length; i++) {
                    addWorkerCard();
                    const cards = document.querySelectorAll('.visitor-card');
                    const card = cards[cards.length - 1];
                    const p = people[i];
                    card.querySelector('.w_name').value = p.name || '';
                    card.querySelector('.w_company').value = p.company || '';
                    card.querySelector('.w_birth').value = String(p.birth || '').replace(/\D/g, '').slice(0, 8);
                    card.querySelector('.w_phone_f').value = String(p.phone_f || '').replace(/\D/g, '').slice(0, 4);
                    card.querySelector('.w_phone_b').value = String(p.phone_b || '').replace(/\D/g, '').slice(0, 4);
                }
                updateWorkerBadge();
            }

            msgEl.style.color = '#15803d';
            msgEl.textContent = `✅ ${usedAi ? 'AI' : '자동'} 채우기 완료! (작업자 ${people.length}명) — 아래 내용 확인 후 제출하세요.`;
        }

        document.getElementById('submit_btn').addEventListener('click', () => {
            const defaultCompany = document.getElementById('company').value.trim();
            const reason = document.getElementById('reason').value.trim();
            const edu_date = document.getElementById('edu_date').value;
            const s_date = document.getElementById('s_date').value;
            const e_date = document.getElementById('e_date').value;
            const manager = document.getElementById('manager').value.trim();
            const approver = document.getElementById('approver').value.trim();

            if (!defaultCompany) { alert("소속 업체명을 입력해주세요."); return; }
            if (!reason) { alert("공사(작업)명을 입력해주세요."); return; }
            if (!edu_date) { alert("안전교육일을 선택해주세요."); return; }
            if (!s_date) { alert("공사 착수일을 선택해주세요."); return; }
            if (!e_date) { alert("공사 완료예정일을 선택해주세요."); return; }
            if (!manager) { alert("담당자 성함을 입력해주세요."); return; }
            if (!approver) { alert("결재자 성함을 입력해주세요."); return; }

            const myName = document.getElementById('name').value.trim();
            const myBirth = document.getElementById('birth').value.trim();
            const myPhoneF = document.getElementById('phone_f').value.trim();
            const myPhoneB = document.getElementById('phone_b').value.trim();

            if (!myName) { alert("작업자 본인의 성함을 입력해주세요."); return; }
            if (myBirth.length !== 8) { alert("작업자 본인의 생년월일 8자리를 입력해주세요."); return; }
            if (myPhoneF.length !== 4 || myPhoneB.length !== 4) { alert("작업자 본인의 휴대전화 번호 8자리를 확인해주세요."); return; }

            const workers = [{
                name: myName,
                company: defaultCompany,
                birth: myBirth,
                phone_f: myPhoneF,
                phone_b: myPhoneB
            }];

            const extraCards = document.querySelectorAll('.visitor-card');
            for (let i = 0; i < extraCards.length; i++) {
                const card = extraCards[i];
                const name = card.querySelector('.w_name').value.trim();
                const individualCompany = card.querySelector('.w_company').value.trim();
                const birth = card.querySelector('.w_birth').value.trim();
                const phone_f = card.querySelector('.w_phone_f').value.trim();
                const phone_b = card.querySelector('.w_phone_b').value.trim();

                if (!name) { alert(`동행 작업자 #${i + 2}의 성함을 입력해주세요.`); return; }
                if (birth.length !== 8) { alert(`동행 작업자 #${i + 2}의 생년월일 8자리를 확인해주세요.`); return; }
                if (phone_f.length !== 4 || phone_b.length !== 4) { alert(`동행 작업자 #${i + 2}의 휴대전화 번호 8자리를 확인해주세요.`); return; }

                workers.push({
                    name: name,
                    company: individualCompany || defaultCompany,
                    birth: birth,
                    phone_f: phone_f,
                    phone_b: phone_b
                });
            }

            const payload = {
                type: "다량공사출입",
                main_company: defaultCompany,
                reason: reason,
                edu_date: edu_date,
                s_date: s_date,
                e_date: e_date,
                manager: manager,
                approver: approver,
                visitors: workers
            };

            if (tg) {
                tg.sendData(JSON.stringify(payload));
            } else {
                console.log("전송 데이터:", payload);
                alert("텔레그램 환경이 아닙니다. 콘솔창에 데이터가 출력되었습니다.");
            }
        });
    </script>
